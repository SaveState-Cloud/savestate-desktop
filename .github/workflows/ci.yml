name: Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend behavior tests
        run: |
          npm run test:js
          npm run test:ui

      - name: Bundle Kopia
        run: npm run bundle:kopia

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check optimized Windows build
        run: cargo check --release --manifest-path src-tauri/Cargo.toml

      - name: Check frontend JavaScript
        shell: pwsh
        run: |
          node --check src/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src/logout-flow.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src/vault-recovery.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/bundle-kopia.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  audit-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
