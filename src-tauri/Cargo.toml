[package]
name = "savestate-app"
version = "2.0.27"
edition = "2021"
description = "SaveState Desktop — Encrypted Cloud Backup Agent"
license = "GPL-3.0-only"
repository = "https://github.com/SaveState-Cloud/savestate-desktop"
homepage = "https://savestate.dk"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "native-tls-vendored"] }
rusqlite = { version = "0.40", features = ["bundled"] }
aes-gcm = "0.11"
argon2 = "0.5"
zstd = "0.13"
tar = "0.4"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dirs = "5"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
walkdir = "2"
cron = "0.13"
hex = "0.4"
futures-util = "0.3.32"
bytes = "1.11.1"
tauri-plugin-single-instance = "2.4.3"
keyring = "4.1.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
chrono-tz = "0.10"
